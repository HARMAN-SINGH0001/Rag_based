
services:
  - type: web
    name: staychat-rag
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: XAI_API_KEY
        sync: false
      - key: XAI_MODEL
        value: grok-4.3
